
<html>
<head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<style>
    body
    {
        font-family: Arial, Helvetica, sans-serif;background-color: bisque;
        padding: 30px;
    }
    .todo-box
    {
        width: 300px;background-color: aqua;padding: 20px;border-radius: 5px;
    }
    ul
    {
        padding: 0;list-style: none;
    }
    .done
    {
        text-decoration: line-through;color: red;
    }
    .delete
    {
        color: brown; cursor: pointer;
    }
</style>
</head>
<body>
    <div class="todo-box">
        <h3>Todo List</h3>
        <input type="text" id="task" placeholder="Enter Task">
        <button id="addtask">Add</button>
        <ul id="tasklist">

        </ul>
    </div>
<script>
    $(function(){
        $("#addtask").click(function(){
            let taskvalue = $("#task").val().trim();
            if(taskvalue==="")
            {
                alert("Task Cannot be empty"); return;
            }
            let li=$("<li></li>").text(taskvalue);
            let del=$("<span class='delete'></span>").text(" DEL");
            li.append(del);
            $("#tasklist").append(li);
            $("#task").val("");
        });
        $("#tasklist").on("click","li",function(){
            $(this).toggleClass("done");
        });
        $("#tasklist").on("click",".delete",function(e){
            e.stopPropagation();
            $(this).parent().remove();
        });
    });
</script>
</body>
</html>
